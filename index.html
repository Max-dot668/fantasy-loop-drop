<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <meta charset="UTF-8">
       <title>Loop Drop</title>

       <!-- Cinzel Font-->
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Top Banner Logo -->
        <header id="header" class="header">
            <h1>Loop Drop 🗡️</h1>
            <h3>Stocking up for the next quest. An interactive shop catalog for weary travelers.</h3>
        </header>

        <!-- Main Content -->
        <main>
            <!-- List of Products -->
            <section id="list-of-items" class="list-of-items">
                <div id="items-container"></div>
            </section>
            <!-- Order Receipt -->
             <section id="order-container" class="order-container"></section>
             <!-- Form Modal -->
             <section id="form-modal" class="hidden">
                <div class="modal" id="payment-modal">
                    <h2>Enter card details</h2>
                    <form id="payment-form">
                        <input type="text" placeholder="Enter your name" id="customerName" name="customerName" required />
                        <input type="text" placeholder="Enter your card number" required />
                        <input type="text" placeholder="Enter CVV" required />
                        <button type="submit" class="pay-btn">Pay</button>
                    </form>
                </div>
             </section>
             <!-- Order Confirmation Message -->
             <section id="order-confirmation" class="order-confirmation"></section>
        </main>
        
        <!-- Footer -->
         <footer>© 2026 Blacksmith & Alchemist Emporium. All rights reserved. Purveyors of fine forged armaments, rare elixirs, and contraband goods. Licensed by the Guild of Merchants.</footer>
	<script src="index.js" type="module"></script>
    </body>
</html>
